<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[Creator Name] — Recipes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script>window.PENG_PATH_DEPTH = 0;</script>
</head>
<body>
  <div class="peng-shell">
    <div id="peng-header"></div>
    <main class="peng-main">
      <section class="peng-hero" id="home-hero"></section>

      <section class="peng-section">
        <div class="peng-container">
          <div style="display:flex;justify-content:space-between;gap:1rem;align-items:end;flex-wrap:wrap;margin-bottom:1.5rem">
            <div>
              <h2 class="peng-section-title">Featured recipes</h2>
              <p class="peng-section-sub" style="margin:0">Cook-tested favorites ready for instant download after checkout.</p>
            </div>
            <a class="peng-btn peng-btn-ghost" href="recipes/">View all</a>
          </div>
          <div class="peng-grid-recipes peng-stagger" id="featured-recipes"></div>
        </div>
      </section>

      <section class="peng-section" style="background:var(--peng-bg-alt);border-top:1px solid var(--peng-sand);border-bottom:1px solid var(--peng-sand)">
        <div class="peng-container">
          <h2 class="peng-section-title">Bundles</h2>
          <p class="peng-section-sub">Save when you grab a pack.</p>
          <div class="peng-grid-recipes peng-stagger" id="home-bundles"></div>
        </div>
      </section>

      <section class="peng-section" id="home-bio"></section>

      <section class="peng-section" style="background:var(--peng-bg-alt);border-top:1px solid var(--peng-sand)">
        <div class="peng-container">
          <h2 class="peng-section-title">What cooks are saying</h2>
          <p class="peng-section-sub">Seeded demo reviews from the config.</p>
          <div class="peng-grid-recipes peng-stagger" id="home-reviews"></div>
        </div>
      </section>

      <section class="peng-section">
        <div class="peng-container" style="max-width:36rem">
          <div id="signup-copy"></div>
          <form id="signup-form" class="peng-card" style="padding:1.25rem">
            <div class="peng-field">
              <label class="peng-label" for="signup-email">Email</label>
              <input class="peng-input" id="signup-email" name="email" type="email" required placeholder="you@email.com">
            </div>
            <button class="peng-btn peng-btn-primary" type="submit" style="width:100%">Get the free recipe</button>
            <p id="signup-success" hidden style="margin:0.75rem 0 0;color:var(--peng-primary-soft);font-weight:600">You're in — check My recipes.</p>
          </form>
        </div>
      </section>
    </main>
    <div id="peng-footer"></div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/format.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/storefront-home.js"></script>
</body>
</html>
